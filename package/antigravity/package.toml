# Antigravity 当模型供应商（包编号 antigravity，仓库、程序叫 miyu-antigravity）：登记模型驱动 antigravity/antigravity，
# 这家供应商的每一次调用交给本机的 Antigravity CLI（agy），用主人在 agy 里已有的登录和订阅额度。设计见 docs/00-设计.md。

[package]
version = "0.1.2"
protocol = [1, 1]
miyu = "2026.11.0-rc.2.4"
name = { en = "Antigravity", zh = "Antigravity" }
summary = { en = "Use the local Antigravity CLI (agy) as a model provider", zh = "把本机的 Antigravity CLI（agy）当模型供应商" }
author = "SHORiN-KiWATA"
upstream = "https://github.com/SHORiN-KiWATA/miyu-antigravity"
license = "AGPL-3.0-or-later"
icon = "rocket"
# 带本机程序；进程组、信号照 Unix 写，只支持 Linux、macOS，不做 Windows（设计第十二节）。
systems = ["linux", "macos"]
targets = ["linux-x86_64", "linux-aarch64", "macos-aarch64"]

[command]
name = "antigravity"
program = "miyu-antigravity"
about = { en = "Antigravity CLI as a model provider (started by the Miyu core)", zh = "把 Antigravity CLI 当模型供应商（由 Miyu 核心拉起）" }

[process]
args = ["serve"]
# model.driver：提供驱动 antigravity；network：agy 自己连 Google 的服务。
capabilities = ["model.driver", "network"]

[[driver]]
name = "antigravity"
cache = "best_effort"
key = "none"
# agy 只收文字，图由核心转述（设计第九节）。
images = false
# agy 自己跑完、Miyu 只照实显示的工具（设计第七节）：代理文件的白名单只开这一件。
hosted = ["search_web"]
# 多久没动静才算断（核心 DR-2）：agy 不流思考的字，头一个字实测常要等一两分钟（设计第十四节第 9、11 条），
# 默认的 180 秒余量不够。只放宽不收紧，高档位照思考强度再放大。
quiet_secs = 300

# 自带的一家供应商（设计第十四节第 1 条）：装上、开着就在主人的供应商列表里，模型写成 antigravity/<模型>，列表照
# driver.models 拉。不写 local：金额照模型目录的 API 价显示（主人定的），想按 0 记的主人自己写。
[providers.antigravity]
name = { en = "Antigravity", zh = "Antigravity" }
driver = "antigravity/antigravity"

[settings.binary]
type = "text"
max = 1024
# 不写默认值：没填就是在 PATH 里找 agy（清单里文字的默认值不能是空的）。
applies = "now"
name = { en = "Executable path", zh = "可执行文件路径" }
description = { en = "Full path of the Antigravity CLI (agy) or of a wrapper script around it; a leading ~ is your home folder. Empty: look for agy on PATH.", zh = "Antigravity CLI（agy）或包着它的脚本的完整路径，开头的 ~ 是家目录。空着：在 PATH 里找 agy。" }

[settings.keep_seconds]
type = "int"
min = 0
max = 86400
default = 600
applies = "now"
name = { en = "Process retention after a turn (seconds)", zh = "对话结束后进程保留时长（秒）" }
description = { en = "After a turn ends, how long its agy process is kept for the next turn of the same conversation before it is stopped. 0: do not keep it.", zh = "一轮对话说完以后，agy 进程留着等同一段对话的下一轮多久，到点收掉。0：不保留。" }

[settings.tool_wait_seconds]
type = "int"
min = 60
max = 86400
default = 3600
applies = "now"
name = { en = "Tool call timeout (seconds)", zh = "工具调用超时时长（秒）" }
description = { en = "How long a tool call handed back to Miyu may take, including time spent waiting for the person to confirm, before agy gives up on it.", zh = "agy 把一次工具调用交回 Miyu 后最多等多久，核心执行工具、等人点确认的时间都算在里面。" }
